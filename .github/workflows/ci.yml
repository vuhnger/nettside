name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require development as the production source
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "development" ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
              echo "Pull requests to main must come from this repository's development branch."
              exit 1
            fi
          fi

  skills:
    name: Skill security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Full versjon, ikke `v9`: setup-uv publiserer ingen flyttbar major-tag.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      # SkillSpector har ingen git-tagger, så pinningen må være en commit.
      # Bumpen er bevisst manuell: en skanner som oppdaterer seg selv kan endre
      # utfallet av en gate uten at noen har sett på diffen.
      - name: Install SkillSpector
        run: |
          uv tool install \
            'git+https://github.com/NVIDIA/skillspector.git@fd25398d7aa99353d86237b9c260759351f0e644'
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Scan skills
        run: ./scripts/scan-skills.sh

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks
        run: pnpm run check

      - name: Build application
        run: pnpm run build
